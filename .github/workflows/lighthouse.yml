name: Lighthouse CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build frontend
        run: npm run frontend:build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /

      - name: Run Lighthouse CI
        id: lighthouse
        run: |
          npx @lhci/cli@0.13.x autorun --config=.lighthouserc.json | tee /tmp/lhci.log
          grep -Eo 'https://storage.googleapis.com/lighthouse-infrastructure.appspot.com/reports/[[:alnum:]-]+\.report\.html' /tmp/lhci.log | sort -u > /tmp/lhci-links.txt
          if [ ! -s /tmp/lhci-links.txt ]; then
            echo "Failed to find temporary public report links in LHCI output."
            exit 1
          fi
          {
            echo "links<<EOF"
            cat /tmp/lhci-links.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add Lighthouse URLs to job summary
        run: |
          echo "## Lighthouse Temporary Public Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.lighthouse.outputs.links }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci-artifacts
          path: .lighthouseci
          if-no-files-found: warn
